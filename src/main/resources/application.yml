spring:
  application:
    name: ticketflow

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:ticketflow_db}
    username: ${DB_USER:ticketflow_user}
    password: ${DB_PASSWORD:ticketflow_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

ticketflow:
  jwt:
    secret: ${JWT_SECRET:V4fuH63PIQTkyyT+BsNz6DWyjV/gsvbB4PPhfETUgc2e4oKiu8EIIY2B1pgO9cd0}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  ai:
    provider: ${AI_PROVIDER:mock}   # mock | openai
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}

logging:
  level:
    com.idam.ticketflow: DEBUG
    org.springframework.security: INFO
